# ============================================================
#  aggregation_decisions.ini — hand-written (D62)
#
#  Which amino acids are dietary indispensable, and how the reference
#  scoring pattern groups them — transcribed BY THE AUTHOR from
#  FAO 2013, Food and Nutrition Paper 92 (source id fao_2013 in
#  mass_fraction_decisions.ini; the PDF is pinned by fetch_literature.py
#  under data/literature/fao_2013/, sha256 in data/literature/manifest.ini).
#  Same shape as carroll_classical_fractionation.ini (D50): one value per
#  key, with the table, page, and the report's own wording next to it.
#
#  Symbols are written as the report prints them (three-letter
#  abbreviations). The aggregation stage resolves them to one-letter
#  symbols through data/iupac/amino_acid_symbols.ini — parsed by code from
#  the IUPAC-IUBMB table (rule C0) — so no amino acid name is typed twice.
#
#  `___` = fill from the PDF. Any `___` a stage meets in a field it needs
#  is a stop, never a default. This file carries no abundance, no weight,
#  and no protein.
# ============================================================

[meta]
source_id      = fao_2013
decision       = D62
transcribed_by = ___
transcribed    = ___
file           = data/literature/fao_2013/35978-02317b979a686a57aa4593304ffc17f06.pdf

# ------------------------------------------------------------
#  The headings of the report's recommended amino acid scoring
#  pattern, in the table's own order, ';'-separated. Where a heading
#  is a group (an abbreviation standing for more than one amino acid),
#  write the abbreviation here and expand it in a [group.<abbreviation>]
#  section below.
# ------------------------------------------------------------

[indispensable_amino_acids]
headings     = ___
location     = ___          ; table number and page the headings were read from
as_reported  = ___          ; the heading row exactly as printed

# ------------------------------------------------------------
#  One section per group heading. `members` = the three-letter symbols
#  the report's abbreviation key gives for that group, ';'-separated,
#  as printed. If the report's key uses a name that differs from the
#  free amino acid this standard carries (D27: the standard reports
#  cysteine), write the report's word in `as_reported` and the symbol
#  in `members`; the mapping is D27's, not this file's.
# ------------------------------------------------------------

[group.___]
members      = ___
location     = ___
as_reported  = ___

