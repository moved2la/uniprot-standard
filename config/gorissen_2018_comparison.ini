# ============================================================
#  gorissen_2018_comparison.ini — HAND-WRITTEN transcription.
#
#  The measured amino acid composition of human skeletal muscle protein reported by
#  Gorissen et al. 2018 (source id gorissen_2018, id_short P10), transcribed from the
#  paper's own Table 1. This is the reference the original Match Rate spreadsheet was
#  calibrated against, and the independent measurement this repository's sequence-derived
#  standard is compared with (D84).
#
#  Transcribed by Claude from data/literature/gorissen_2018/726_2018_Article_2640.pdf,
#  page-level locations on every value, for the author to audit (D79).
#
#  This file states what the paper reports and how the paper says it was measured.
#  It states NOTHING about which is right: the comparison stage puts the two
#  measurements side by side and computes the difference. No verdict (D54 pattern).
#
#  Code names no amino acid: the row labels below are the paper's own, and are resolved
#  to one-letter symbols through the IUPAC-IUBMB trivial names in
#  data/iupac/amino_acid_symbols.ini, the same join the USDA stage uses (rule U3).
# ============================================================

[meta]
source_id      = gorissen_2018
decisions      = D84
transcribed_by = Claude, from the PDF; audited by the author (D79)
transcribed    = 2026-09-17
file           = data/literature/gorissen_2018/726_2018_Article_2640.pdf

# ------------------------------------------------------------
#  What was measured, and how. Every line is the paper's own statement.
# ------------------------------------------------------------

[sample]
tissue           = m. vastus lateralis, human
n                = 10
as_reported      = Human skeletal muscle samples were obtained from the m. vastus lateralis from ten volunteers who participated in a previously published trial (Gorissen et al. 2014)
location         = p. 1686, right column, "Protein sources", last paragraph, final sentences
preparation      = freeze-dried muscle tissue, analysed as a protein source alongside the isolates
role_in_paper    = included as the reference protein with an 'ideal' amino acid composition for muscle protein synthesis
role_location    = p. 1686, right column, "Protein sources", last paragraph

[method]
hydrolysis       = 6 M HCl, 12 h, 110 C, oxygen absent; approximately 6 mg freeze-dried tissue
quantification   = UPLC-MS/MS (Waters Acquity BEH C18), stable-isotope-labelled internal standards
protein_content  = Dumas combustion for nitrogen, times 6.25 as a single conversion factor for every sample
location         = p. 1687, left column, "Amino acid profile analysis", first paragraph; and "Protein content analysis", first paragraph
note             = A single nitrogen-to-protein factor of 6.25 was used for every protein source so that sources could be compared directly; the paper states the debate over source-specific factors explicitly.

[protein_content_of_the_muscle_sample]
value            = 84
unit             = percent of freeze-dried tissue mass
as_reported      = Freeze-dried human skeletal muscle tissue contained 84% protein.
location         = p. 1688, left column, second sentence on the page (the paragraph begins on p. 1687 under "Protein content"): "Freeze-dried human skeletal muscle tissue contained 84% protein."

# ------------------------------------------------------------
#  Table 1, "Human muscle" column. Values are g per 100 g RAW MATERIAL
#  (freeze-dried tissue), not per 100 g protein - the table's own footnote.
#
#  Keys are the paper's row labels, verbatim. Every value: p. 1690, Table 1,
#  row "<the key>", column "Human muscle".
# ------------------------------------------------------------

[values.human_muscle]
Threonine       = 2.9
Methionine      = 1.7
Phenylalanine   = 3.8
Histidine       = 2.8
Lysine          = 6.6
Valine          = 4.3
Isoleucine      = 3.4
Leucine         = 6.3
Serine          = 2.3
Glycine         = 3.1
Glutamic acid   = 13.1
Alanine         = 4.1
Tyrosine        = 2.0
Arginine        = 4.4

[values.human_muscle.location]
table            = p. 1690, Table 1, column "Human muscle"; row label as the key
units            = g per 100 g raw material
units_location   = p. 1690, Table 1, footnote, first sentence
units_note       = The paper quantifies the free amino acids of the hydrolysate against free amino acid standards (Sigma A9906, p. 1687, "Amino acid profile analysis", first paragraph) and states no conversion to residue equivalents anywhere; the values are therefore read as free-amino-acid masses, the same convention as USDA and as this repository's free-convention standard (D7). This reading is an interpretation of what the paper does not say, and the mass balance (X6) depends on it.
essential_rows   = Threonine, Methionine, Phenylalanine, Histidine, Lysine, Valine, Isoleucine, Leucine
essential_rows_location = p. 1687, right column, paragraph beginning "During acid hydrolysis", third sentence: "As tryptophan was not measured, the sum of essential amino acids includes threonine, methionine, phenylalanine, histidine, lysine, valine, isoleucine, and leucine." Also the Table 1 grouping (p. 1690) and the Fig. 2 note (p. 1688).
sums_as_printed  = EAA 31.8 (row "SigmaEAA"), non-EAA 29.0 (row "SigmaNEAA"); the stage checks the transcription against both, grouping the rows as essential_rows says.
#                  Proline and cysteine print as 0.0 and are declared in [not_measured], so they contribute nothing
#                  to either printed sum and the check still holds with them removed from the values above.

# ------------------------------------------------------------
#  What the method does to the twenty, in the paper's own words. This is what
#  makes the comparison set: an amino acid that was converted into another
#  before measurement is not a separate number, and one that was destroyed or
#  not reported is not a number at all.
# ------------------------------------------------------------

[hydrolysis_conversions]
# <measured row label> = <the trivial names the row's value contains>
Glutamic acid    = Glutamic acid + Glutamine
conversion_basis = During acid hydrolysis, the non-essential amino acids asparagine and glutamine are converted into aspartic acid and glutamic acid, respectively
location         = p. 1687, right column, paragraph beginning "During acid hydrolysis", first sentence; the Table 1 footnote (p. 1690) also lists glutamine among the four not measured

[not_measured]
# Why each of these is absent from Table 1. Each is excluded from the comparison on both sides.
Tryptophan       = decomposed during acid hydrolysis, which precludes detection (p. 1687, right column, paragraph beginning "During acid hydrolysis", first sentence; Table 1 footnote p. 1690); the paper states the essential amino acid sum therefore excludes it (same paragraph, second sentence)
Aspartic acid    = listed as not measured in the Table 1 footnote (p. 1690), although hydrolysis converts asparagine into it
Asparagine       = converted into aspartic acid during hydrolysis (p. 1687, right column, paragraph beginning "During acid hydrolysis", first sentence), and aspartic acid was not measured; the Table 1 footnote (p. 1690) lists asparagine among the four not measured
Proline          = printed as 0.0 in the human muscle column (p. 1690). Not a measurement: proline is not destroyed by acid hydrolysis, is not named anywhere in the paper among the amino acids its method struggles with, and the fifteen other protein sources in the same table - same instrument, same procedure - carry 1.8 to 8.8 g/100 g. A protein containing no proline does not exist. Read as a failure in that one cell (D85).
Cysteine         = printed as 0.0 in the human muscle column (p. 1690). Not a measurement: the paper names cysteine as at risk under its method and says hydrolysis was terminated at 12 h to minimize its reduction (p. 1687). The mass balance in [mass_balance] does not permit a true zero either (D85).

[caveats]
# Facts a reader of the comparison needs, each from the paper.
single_factor    = Protein content is nitrogen times 6.25 for every sample including muscle (p. 1687); the paper notes that source-specific factors exist for some sources and were deliberately not used. On whole freeze-dried muscle that factor counts non-protein nitrogen - creatine, carnosine, free amino acids, nucleotides, urea - so it overstates protein. See [mass_balance].

# ------------------------------------------------------------
#  The mass balance. Computed by the stage, not typed here: it asks whether the
#  fourteen printed non-zero values can be reconciled with the paper's own protein content,
#  and it is the argument that justifies excluding the two zeros above (D85).
#
#  Hydrolysis ADDS mass - one water per peptide bond broken - so a gram of protein
#  yields more than a gram of free amino acids. The factor comes from this
#  repository's own composition and the PubChem free and residue masses; nothing
#  about it is transcribed from the paper.
#
#  Two protein contents are tested, and the stage reports both without choosing:
#  the paper's own, and this repository's already-cited direct measurement (D77).
# ------------------------------------------------------------

[mass_balance]
compare_against  = gorissen_nitrogen_derived, mingrone_2001_measured
mingrone_source  = config/non_protein_metabolite_pools.ini [protein_content] and [water_content] (D77, source id mingrone_2001)
note             = A recovery near 100 % means the printed values are reconcilable with that protein content; well under 100 % means either the protein figure is too high or amino acids are missing beyond those declared. No verdict is drawn: the stage prints both and stops.
