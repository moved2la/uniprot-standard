# ============================================================
#  bound_metabolite_pools.ini — hand-written (D73–D77)
#
#  The inputs to the bound-metabolite adjustment of the skeletal muscle
#  standard: how much of one amino acid the muscle holds in a stable
#  non-protein form (carnosine → histidine), and how much protein sits
#  beside it in the same kilogram of muscle, so the two can be added.
#  Read by pipeline/bound_pools.py, which writes
#  outputs/standard/_calculated_amino_acid_standard_with_bound_pools.tsv
#  and its companion tables. The protein-only standard is never changed
#  by this file (D76).
#
#  Transcribed BY THE AUTHOR from the cited PDFs on disk
#  (data/literature/<source_id>/, sha256 in data/literature/manifest.ini;
#  the D50 pattern), one value per key with the table, page, or paragraph
#  it was read from. `___` = not yet transcribed: the stage writes its
#  summary saying so and no adjusted table, and a test fails until every
#  `___` is gone. Nothing here is a weight, a protein, or an amino acid
#  mass — the amino acid is named by the three-letter symbol the sources
#  use and resolved by code through the IUPAC-IUBMB table; its free mass
#  is the one fetched from PubChem in the composition stage.
#
#  `basis` says what the source measured per kilogram of: `dry` (freeze-
#  dried muscle) or `wet` (fresh muscle). The code puts protein content
#  on the pool's basis through [water_content] and nothing else.
#  `applies_to` lists the fiber-type columns a single-fiber value fills
#  (D74: the sources measure "type II", so IIa and IIx take the same value).
#  Lists are comma-separated (a ';' after whitespace starts a comment).
# ============================================================

[meta]
decisions      = D73, D74, D75, D76, D77   ; the D-numbers that scope this adjustment; renumber here if decisions.md moves them
transcribed_by = ___
transcribed    = ___
version_label  = skeletal muscle protein + carnosine

# ------------------------------------------------------------
#  The pool. One section per bound pool carried. Only carnosine
#  is carried (D75): the cited review states it is the sole
#  histidine-containing dipeptide in human muscle.
# ------------------------------------------------------------

[pool.carnosine]
amino_acid             = His          ; three-letter symbol as the sources print it; resolved by code (rule C0)
moles_amino_acid_per_mole = 1         ; one histidine per carnosine on hydrolysis (β-alanyl-L-histidine); β-alanine is not one of the twenty and is not counted
sole_pool_source       = Harris, Wise, Price, Kim, Kim & Sale 2012, Amino Acids 43:5-12, doi 10.1007/s00726-012-1233-y (source id harris_2012)
sole_pool_location     = ___          ; section and paragraph of the statement that carnosine is the only histidine-containing dipeptide in human muscle
sole_pool_as_reported  = ___
retrieved              = ___

