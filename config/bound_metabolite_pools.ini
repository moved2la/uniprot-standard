# ============================================================
#  bound_metabolite_pools.ini — hand-written (D73–D77)
#
#  The inputs to the bound-metabolite adjustment of the skeletal muscle
#  standard: how much of one amino acid the muscle holds in a stable
#  non-protein form (carnosine → histidine), and how much protein sits
#  beside it in the same kilogram of muscle, so the two can be added.
#  Read by pipeline/bound_pools.py, which writes
#  outputs/standard/_calculated_amino_acid_standard_with_bound_pools.tsv
#  and its companion tables. The protein-only standard is never changed
#  by this file (D76).
#
#  Transcribed BY THE AUTHOR from the cited PDFs on disk
#  (data/literature/<source_id>/, sha256 in data/literature/manifest.ini;
#  the D50 pattern), one value per key with the table, page, or paragraph
#  it was read from. `___` = not yet transcribed: the stage writes its
#  summary saying so and no adjusted table, and a test fails until every
#  `___` is gone. Nothing here is a weight, a protein, or an amino acid
#  mass — the amino acid is named by the three-letter symbol the sources
#  use and resolved by code through the IUPAC-IUBMB table; its free mass
#  is the one fetched from PubChem in the composition stage.
#
#  `basis` says what the source measured per kilogram of: `dry` (freeze-
#  dried muscle) or `wet` (fresh muscle). The code puts protein content
#  on the pool's basis through [water_content] and nothing else.
#  `applies_to` lists the fiber-type columns a single-fiber value fills
#  (D74: the sources measure "type II", so IIa and IIx take the same value).
#  Lists are comma-separated (a ';' after whitespace starts a comment).
# ============================================================

[meta]
decisions      = D73, D74, D75, D76, D77, D78, D79   ; the D-numbers that scope this adjustment; renumber here if decisions.md moves them
transcribed_by = Claude, by code-assisted read of the PDFs on disk, every value with the page/table it was read from; audited by the author (D79 — supersedes the author-only transcription of D50 for this file)
transcribed  = 2026-09-17
version_label  = skeletal muscle protein + carnosine

# ------------------------------------------------------------
#  The pool. One section per bound pool carried. Only carnosine
#  is carried (D75): the cited review states it is the sole
#  histidine-containing dipeptide in human muscle.
# ------------------------------------------------------------

[pool.carnosine]
amino_acid             = His          ; three-letter symbol as the sources print it; resolved by code (rule C0)
moles_amino_acid_per_mole = 1         ; one histidine per carnosine on hydrolysis (β-alanyl-L-histidine); β-alanine is not one of the twenty and is not counted
sole_pool_source       = Harris, Wise, Price, Kim, Kim & Sale 2012, Amino Acids 43:5-12, doi 10.1007/s00726-012-1233-y (source id harris_2012)
sole_pool_location = p. 6, section "Species", first paragraph, second sentence
sole_pool_file = data/literature/harris_2012/s00726-012-1233-y.pdf (Amino Acids 43:5-12)
sole_pool_as_reported = "For human and equine muscle, where carnosine is the sole M-HCD in both, there is typically a sixfold range in content between m. vastus lateralis in humans and m. gluteus medius in equines"
retrieved    = 2026-09-17

# ------------------------------------------------------------
#  Pool size, single fibers (the values the fiber-type columns use; D74).
#  No whole-muscle value is carried (Vega 2022 dropped 2026-09-17); a
#  [<pool>.whole_muscle] section, if ever added, feeds the basis and
#  subgroup sensitivities and nothing else.
# ------------------------------------------------------------

[carnosine.single_fiber.type_I]
value        = 10.5
spread       = 7.6
spread_kind  = +/- as printed in the abstract; whether SD or standard error is not stated in the abstract (the article is paywalled)
n_subjects   = 4
n_fibers     = not stated in the abstract
basis        = dry
applies_to   = I
source_id    = harris_1998
location     = p. 639, Abstract, second sentence
file         = data/literature/harris_1998/026404198366443.pdf (the abstract page; J Sports Sci 1998;16:639-643)
population   = four male subjects; vastus lateralis needle biopsy; single fibres typed I / II by myosin ATPase
as_reported  = "10.5 +/- 7.6 mmol . kg -1 dry weight" (type I)
retrieved    = 2026-09-17

[carnosine.single_fiber.type_II]
value        = 23.2
spread       = 17.8
spread_kind  = +/- as printed in the abstract; whether SD or standard error is not stated in the abstract (the article is paywalled)
n_subjects   = 4
n_fibers     = not stated in the abstract
basis        = dry
applies_to   = IIa, IIx
source_id    = harris_1998
location     = p. 639, Abstract, second sentence
file         = data/literature/harris_1998/026404198366443.pdf (the abstract page; J Sports Sci 1998;16:639-643)
population   = four male subjects; vastus lateralis needle biopsy; single fibres typed I / II by myosin ATPase
as_reported  = "23.2 +/- 17.8 ... mmol . kg -1 dry weight" (type II)
retrieved    = 2026-09-17

# ------------------------------------------------------------
#  The denominator: protein and water per kilogram of muscle (D77):
#  Mingrone et al. 2001's direct measurement, wet basis. Muscle is
#  rectus abdominis, not vastus lateralis — stated in every header.
# ------------------------------------------------------------

[protein_content]
value        = 155
spread       = 37
spread_kind  = SD over 16 subjects; each subject's value the mean of triplicate determinations (Statistical analysis, p. E368)
n_subjects   = 16
basis        = wet
source_id    = mingrone_2001
location     = p. E368, Table 1, row "Proteins, %", column "Control Group (n = 16)"
file         = data/literature/mingrone_2001/ajpendo.2001.280.2.E365.pdf
population   = 16 lean (control) subjects, BMI 21.8 +/- 2.4 kg/m2, age 52.2 +/- 11.2 y, nondiabetic; rectus abdominis, biopsy >= 6 g at abdominal surgery
as_reported  = "Proteins, %  15.5 +/- 3.7" (Table 1, control group); footnote "Values (mean +/- SD) reported refer to 100 mg of wet tissue"
note         = value = percent x 10 (Table 1 footnote: values per 100 mg of wet tissue); population from p. E366, Subjects and Muscle biopsy; protein by Bio-Rad colorimetric assay on the dried tissue (p. E366)
retrieved    = 2026-09-17

[water_content]
value        = 763
spread       = 32
spread_kind  = SD over 16 subjects
source_id    = mingrone_2001
location     = p. E368, Table 1, row "H2O, %", column "Control Group (n = 16)"
file         = data/literature/mingrone_2001/ajpendo.2001.280.2.E365.pdf
as_reported  = "H2O, %  76.3 +/- 3.2" (Table 1); "76.3 +/- 3.3% in normal-weight individuals" (Abstract)
note         = value = percent x 10; water by freeze-drying (p. E366); the abstract (p. E365) prints 76.3 +/- 3.3 for the same group
retrieved    = 2026-09-17

# ------------------------------------------------------------
#  Turnover — the resupply frame, a sensitivity only (D73).
#  Half-lives in weeks; the code converts to a fractional rate per
#  day as ln 2 / (7 × t_half). Muscle protein: the basal mixed-muscle
#  fractional synthesis rate in percent per hour, low and high ends of
#  the published range, each from its own study as the review cites it.
# ------------------------------------------------------------

[turnover.carnosine.yamaguchi_2021]
t_half_weeks = 4.6
ci_low_weeks = 3.2
ci_high_weeks = 7.0
source_id    = yamaguchi_2021
location     = accepted manuscript p. 14, lines 332-334 (Results, "Modelling the kinetics of muscle carnosine washout")
file         = data/literature/yamaguchi_2021/1389887_Sale.pdf (accepted manuscript; the journal version is Med Sci Sports Exerc 2021;53:1079-1088)
as_reported  = "The t1/2 for M-Carn washout in the exponential decay model was calculated to be 4.6 weeks (95%CI:3.2-7.0)"
note         = restated on manuscript p. 15, lines 363-365 (Discussion); vastus lateralis, HPLC on freeze-dried biopsies, 11 men on beta-alanine; the linear model fit slightly better than the exponential (p. 14, lines 328-332)
retrieved    = 2026-09-17

[turnover.carnosine.baguet_2009]
t_half_weeks = 5.8
source_id    = baguet_2009
location     = p. 841, first column, first paragraph
file         = data/literature/baguet_2009/japplphysiol.91357.2008.pdf
as_reported  = "A decline of 30% at 3 wk would predict a half-life of 5.8 wk."
note         = soleus, tibialis anterior, gastrocnemius by 1H-MRS, 8 men on beta-alanine; the authors observed a linear washout of 2-4 %/wk (Abstract, p. 837) and give this half-life as the first-order equivalent of the 30 % decline at 3 wk
retrieved    = 2026-09-17

# [turnover.muscle_protein.<name>] sections would carry the basal mixed-muscle fractional synthesis
# rate in percent per hour, low and high ends of the published range, each from a primary study on
# disk. None is carried (author's call, 2026-09-17: no further literature for this step), so the
# resupply-frame sensitivity is NOT computed and bound_pools_summary.ini says so. Add sections of
# that name, with their PDFs in data/literature/, to enable it.
