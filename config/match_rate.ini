# ============================================================
#  match_rate.ini — HAND-WRITTEN. What Match Rate scores, against what, and from where.
#
#  The formula itself is one line of code (pipeline/match.py, match_rate()) and is written out by
#  hand in docs/formula.md, "Match Rate". It was transcribed from the author's spreadsheet
#  Base_Match_Rate_Formula.xlsx (2026-09-17) as it is (D87). This file names the references, the
#  scored sets, and the food tables; it names no amino acid by hand except where a decision
#  requires one (D86: which member of a FAO group is scored), and those are three-letter symbols
#  resolved through data/iupac/amino_acid_symbols.ini, the same join every other stage uses.
#
#  Rules M1-M6 in docs/conventions.md.
# ============================================================

[meta]
decisions      = D86, D87, D88
transcribed_by = Claude, from the author's spreadsheet; the four foods in the spreadsheet are the transcription test (tests/test_match.py)
transcribed    = 2026-09-17
version        = 1.0
note           = version is the Match Rate label carried into every output header (plan R7 section 6). It is not the standard's version; the standard is not versioned before release.

[formula]
# D87, rule M1. Both shares over the scored set only; the smallest ratio is the score.
score             = minimum over the scored set of (food share / reference share)
primary_reference = skeletal_muscle_protein_with_non_protein_metabolite_pools
note              = The spreadsheet's Steps 8-10b (divide by the limiting ratio, sum the "need to consume", call the excess wasted) reduce to 1 - score exactly; docs/formula.md shows the algebra. The steps table writes the spreadsheet's own walk (Steps 3, 7, 10b, and rows 153-156) per food and reference so every score can be rebuilt in the spreadsheet (M5).

# ------------------------------------------------------------
#  Scored sets. A reference names one. Two kinds:
#    fao_headings_reduced  the headings of fao_2013_indispensable_amino_acids.ini, each group scored as
#                          the member named here (D86)
#    rows_named_in_file    a list of rows another config file names (the paper's own essential set)
# ------------------------------------------------------------

[scored_set.fao_2013_indispensable]
decision            = D86
kind                = fao_headings_reduced
from_file           = config/fao_2013_indispensable_amino_acids.ini
group_scored_as.SAA = Met
group_scored_as.AAA = Phe
note                = FAO 2013's nine headings (D62), each group reduced to its indispensable member: methionine for SAA, phenylalanine for AAA. Cysteine and tyrosine are not scored. A conditionally-indispensable output is a later, separate scored set (author, 2026-09-16).

[scored_set.gorissen_2018_essential]
decision     = D87
kind         = rows_named_in_file
from_file    = config/gorissen_2018_comparison.ini
from_section = values.human_muscle.location
from_key     = essential_rows
note         = The eight amino acids the paper sums as essential (no tryptophan: destroyed by acid hydrolysis). This is the set the original spreadsheet scored, so the old scores are reproduced on the old set.

# ------------------------------------------------------------
#  References. Each is one column of a calculated standard (file + column) or one section of a
#  transcription (config + section). The section name is the reference id used in column names
#  (match_<id>_percent), in the `reference` column, and in file names; label is the full
#  description, carried once in every output header with the reference's values.
# ------------------------------------------------------------

[reference.skeletal_muscle_protein_with_non_protein_metabolite_pools]
file       = outputs/standard/_calculated_amino_acid_standard_with_non_protein_metabolite_pools.tsv
column     = standard_with_non_protein_metabolite_pools
scored_set = fao_2013_indispensable
label      = skeletal muscle protein + non-protein metabolite pools (carnosine), fiber-type mix
decisions  = D58, D66, D72, D73-D79, D82
note       = The primary reference (plan R9 fork point; author 2026-09-16). Percent of amino acid mass, free convention (D7): the same convention USDA reports foods in.

[reference.skeletal_muscle_protein]
file       = outputs/standard/_calculated_amino_acid_standard.tsv
column     = standard
scored_set = fao_2013_indispensable
label      = skeletal muscle protein (protein only), fiber-type mix
decisions  = D58, D66, D72
note       = Carried so the effect of the non-protein metabolite pools on scores is visible beside the primary.

[reference.gorissen_2018_human_muscle]
config     = config/gorissen_2018_comparison.ini
section    = values.human_muscle
scored_set = gorissen_2018_essential
label      = Gorissen et al. 2018, Table 1, human muscle, g per 100 g raw material (the original Match Rate reference)
decisions  = D84, D87
note       = The column the original spreadsheet scored against, on the eight amino acids it scored. Carried so that old and new scores stand side by side; not a standard of this repository.

[reference.blood]
file       = outputs/blood/standard/_calculated_amino_acid_standard.tsv
column     = standard
scored_set = fao_2013_indispensable
label      = blood: plasma + erythrocytes at the base split (haemoglobin share as measured), reference male
decisions  = D95-D120, D124
note       = Blood alone (Step 7b). Additive beside the muscle references (D124): nothing scored before it changes. Whether blood alone is a meaningful reference for a food is an analysis question; the column is what makes the comparison possible.

[reference.skeletal_muscle_with_non_protein_metabolite_pools_and_blood]
file       = outputs/composite/_calculated_amino_acid_standard_composite.tsv
column     = composite
scored_set = fao_2013_indispensable
label      = skeletal muscle protein + non-protein metabolite pools (carnosine) and blood, mixed by protein mass (Layer C), reference male
decisions  = D121, D122, D123, D124
note       = The composite of every category standard built so far (config/tissue_mass_fractions.ini): closer to what the reference person is made of than muscle alone, and not the whole body (two categories). Additive beside the primary (D124); the primary stays the muscle reference (D82).

# ------------------------------------------------------------
#  Foods (M4). Two tables, no dedup between them (U6): every row names its source.
# ------------------------------------------------------------

[foods.usda]
file = outputs/usda/amino_acids_per_food.tsv
note = generated by pipeline/usda.py from the hand-downloaded FoodData Central archives (D83); grams per 100 g of food, as published

[foods.other_sources]
file = config/food_amino_acids_other_sources.csv
note = hand-maintained by the author: foods USDA does not carry (supplier analyses, labels, a paper's table). One row per food; label is the identity, source and location the citation; grams per 100 g of product; blank = not reported. Columns are described in docs/conventions.md.

[output]
decimals = 4
