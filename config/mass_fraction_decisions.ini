# ------------------------------------------------------------
#  Column mapping for the primary file. Each value is the exact
#  header string as it appears in the sheet; `location` cites the
#  paper text or file legend that defines the column. Fill at
#  download. mass_fractions.py (3b) reads these and nothing else.
# ------------------------------------------------------------

[columns.murgia_2021.file.1]
sheet                   = Sheet1
header_row              = 3
identity_column         = Gene names
identity_kind           = gene_name
median_type_I           = Median 1 
median_type_IIa         = Median 2A 
median_type_IIx         = Median 2X 
sd_type_I               = Standard deviation 1  
sd_type_IIa             = Standard deviation 2A 
sd_type_IIx             = Standard deviation 2X 
valid_values_type_I     = Valid values   1
valid_values_type_IIa   = Valid values 2A
valid_values_type_IIx   = Valid values 2X
missing_value_token     = NaN
scale_anchor            = ACTA1 row = 100000 in all three median columns
location                = Murgia 2021, Results para. 1; Methods, "Single-fiber proteomics"; file cell E1 "(values normalized to ACTA1)"
quantity_definition     = summed peptide intensity / theoretically observable peptides, normalised to ACTA1 per fiber; median over fibers of the type
quantity_source         = Murgia 2021, Methods, "Single-fiber proteomics", final paragraph
header_whitespace       = headers carry trailing/doubled spaces; the reader strips whitespace on match and records that it did

[columns.deshmukh_2021.file.2]
# Transcribed from the file's own headers (literature_inventory run 2026-09-12T20:20Z,
# outputs/literature_inventory/literature_header_rows.tsv). Spellings are the file's.
member                  = Supplemental Data 3_Cumulative abundance type 1 and type 2 pre.xlsx
sheet_slow              = Type 1
sheet_fast              = Type 2
header_row              = 1
identity_column         = Protein IDs
identity_kind           = accession_list
gene_column             = Gene names
intensity_column        = Median intesity
cumulative_column       = Commulative protein abundance
quantity_definition     = median over the five PRE-training pools of MaxLFQ intensity; "Commulative protein abundance" = running share of summed LFQ intensity (Deshmukh 2021, Methods, "Protein abundance": LFQ intensity / summed LFQ intensity)
location                = Deshmukh 2021, Results, "Proteomics analysis reveals new markers ... (Supplementary Data 3)"; Methods, "Protein abundance"
fast_pool_composition   = fast pools ~80% MYH2 / ~20% MYH1 (Deshmukh 2021, Fig. 1f; D36) — the fast sheet is compared with the IIa gel values with that caveat
use                     = intensity-share MHC:actin per sheet, over the D52 band families, as a third measurement beside Carroll 2004 and iBAQ x MW (D54); never a weight (D36)

# ------------------------------------------------------------
#  In-silico digest rules (pipeline/digest.py). Every value must
#  carry a citation before the stage will run. Candidate values
#  from the planning discussion are NOT entered — verify against
#  the cited method (MaxQuant iBAQ implementation; Schwanhausser
#  2011 Methods) and then fill.
# ------------------------------------------------------------

[digest]
enzyme                  = trypsin
cleave_after            = KR
cleave_before_proline   = both
min_length              = 6
max_length              = 30
missed_cleavages        = 0
source                  = Schwanhausser et al. 2011 (B4), Methods, iBAQ definition, as restated in Nature Sci Data 2018;5:180128 (doi 10.1038/sdata.2018.128): "theoretically observable tryptic peptides between 6 and 30 amino acids". Proline rule not stated in A1 Methods; both computed, difference disclosed (D49).
retrieved               = 2026-09-12