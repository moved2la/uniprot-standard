# ============================================================
#  mass_fraction_decisions.ini — the ONLY hand-written input to Step 3
#
#  Contains: literature sources (DOI, role D-number, download URLs),
#  per-file column-to-fiber-type mappings (transcribed from the file's
#  own header/legend, cited by sheet and header string), and the
#  in-silico digest rules with their citation.
#
#  Contains NO protein names, NO accessions, NO abundance numbers,
#  and NO non-human data source. A test asserts the first three.
#  Sources dropped from earlier drafts are recorded in decisions.md
#  (D38, D39), not here.
#
#  File naming (F7): every stored file keeps the filename from its URL,
#  saved under data/literature/<source_id>/. A file you obtain yourself
#  (blocked download, paywall) is saved there under that same name —
#  the browser's default — and its section carries
#  file.<n>.obtained = manual.
#
#  `___` = fill on a networked machine. Any stage that meets `___`
#  in a field it needs stops and flags; it never defaults.
# ============================================================

[meta]
step            = 3a
written         = 2026-09-11
governing_rule  = PROVENANCE.md
decisions_from  = D31

# ------------------------------------------------------------
#  Sources. One section per source. role_decision cites the
#  D-number that assigned the role. Files are listed as
#  file.<n>.url / file.<n>.published_name / file.<n>.sha256.
#  sha256 is blank until fetch_literature.py records it (downloaded
#  or hand-obtained alike); every later run must reproduce it.
# ------------------------------------------------------------

