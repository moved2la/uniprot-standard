# ============================================================================
#  protein_set_decisions.ini  --  HAND-WRITTEN (see docs/conventions.md)
#
#  This file contains only author decisions: the seed word for each tier, the
#  exact Gene Ontology term name looked up for it, the ontology file to use,
#  and closures of flags raised by the code. It never contains a protein.
#  Every entry cites its D-number in docs/decisions.md.
# ============================================================================

[ontology_source]
# Permanent URL of the basic release of the Gene Ontology (decision D15).
url = http://purl.obolibrary.org/obo/go/go-basic.obo

[tier.1]
seed_word       = myofibrillar
seed_decision   = D3
lookup_name     = myofibril
lookup_decision = D13

[tier.2]
# Tier 2 is the measured remainder (D56): every gene quantified in the primary
# Layer B dataset that is not in Tier 1, mapped by code to a reviewed human
# UniProt entry, minus the entries of the cited contaminant list. The Gene
# Ontology lookup of D14 ("sarcoplasm") is superseded for this tier.
seed_word           = the rest of the fiber, as measured
seed_decision       = D4
definition          = measured_remainder
definition_decision = D56
dataset_source      = murgia_2021          ; [source.*] in config/mass_fraction_decisions.ini, role = primary
dataset_file        = file.1               ; its [columns.*] map names the identity column
contaminant_source  = contaminants_maxquant ; [source.*] in config/mass_fraction_decisions.ini, role = contaminant_list

# ----------------------------------------------------------------------------
#  Flag closures. One section per flag subject from outputs/flags.tsv.
#  Add sections here only in response to a raised flag; each carries a D-number.
#
#  [flag.<accession>]
#  rule         = chain_position_uncertain
#  decision     = D<n>
#  master_start = <int>
#  master_end   = <int>
#
#  [flag.<accession>.tier<N>]
#  rule     = pool_member_without_subtree_annotation
#  decision = D<n>
# ----------------------------------------------------------------------------
