# usda_food_data.ini — HAND-WRITTEN. The USDA FoodData Central archives this repository reads,
# and the nutrients it carries besides the twenty coded amino acids.
#
# What is hand-written here: which archives are used, which release of each, and the name each
# extra nutrient goes by in the archive's own nutrient.csv. Nothing else. The file name on disk,
# its SHA-256, the food list, the nutrient ids, and the amino acid name -> letter join are all
# read from the archives by pipeline/usda.py (rules U1-U7, docs/conventions.md).
#
# The archives are downloaded by hand from https://fdc.nal.usda.gov/download-datasets (CSV, not
# JSON) and dropped unrenamed into data/usda/. They are gitignored: this repository is not a
# mirror of USDA's data. data/usda/manifest.ini — the name, the hash, the size — is the record,
# and it is committed. Anyone can download the same release and check the hash.
#
# Only the data types that carry amino acid panels are used (D83). Branded Foods is label data
# and carries no amino acids; FNDDS values are compiled from the other types.

[meta]
decisions      = D83
transcribed_by = Claude, read from the FoodData Central download page; audited by the author (D79)
transcribed    = 2026-09-17
version_label  = USDA FoodData Central

# ------------------------------------------------------------
#  The archives. One section per data type.
#
#  data_type  the value the archive's own food.csv carries in its data_type column. This is how
#             the stage identifies which zip in data/usda/ is which; the file may be named
#             anything. Also the name of the archive's membership file (<data_type>.csv).
#  release    the release as the download page labels it. A statement of which download this is;
#             the SHA-256 in the manifest is the identity that matters.
#  precedence lower number = the more recent measurement of the same food. Recorded, not applied:
#             no food is dropped for appearing in two archives (rule U6).
# ------------------------------------------------------------

[archive.foundation_food]
data_type      = foundation_food
release        = 2026-04
published_name = FoodData Central, Foundation Foods, April 2026 release
url            = https://fdc.nal.usda.gov/download-datasets
obtained       = manual
precedence     = 1
note           = analytical values with per-value sample counts and ranges; a few hundred foods, updated each April and October

[archive.sr_legacy_food]
data_type      = sr_legacy_food
release        = 2018-04
published_name = FoodData Central, SR Legacy, April 2018 release (final)
url            = https://fdc.nal.usda.gov/download-datasets
obtained       = manual
precedence     = 2
note           = the final release of Standard Reference; frozen, never updated again; the bulk of the foods with amino acid panels

# ------------------------------------------------------------
#  Nutrients carried besides the twenty coded amino acids.
#
#  The twenty are joined automatically: a nutrient is amino acid X when its name in the archive's
#  nutrient.csv equals the IUPAC-IUBMB trivial name of X in data/iupac/amino_acid_symbols.ini
#  (rule U3). No amino acid is named here. USDA reports no asparagine or glutamine — acid
#  hydrolysis converts them — so no food can carry all twenty; the stage states what is absent
#  per food rather than deciding what "complete" means (rule U5).
#
#  Each key below is the column the value lands in; each value is the name to match in
#  nutrient.csv, case-insensitively. The generated outputs/usda/usda_nutrient_map.tsv shows
#  what matched what.
# ------------------------------------------------------------

[carried_nutrients]
protein        = Protein
nitrogen       = Nitrogen
cystine        = Cystine
hydroxyproline = Hydroxyproline

# cystine: USDA reports some foods under "Cysteine" (carried as amino acid C by the name join)
# and others under "Cystine" (carried in its own column here). No food carries both. Whether a
# cystine value converts to cysteine, and at what factor, is an OPEN DECISION — it turns on
# whether USDA's cystine figure is already expressed as cysteine equivalent, which has to be read
# from the FoodData Central documentation, not assumed. Cysteine is not one of the indispensable
# amino acids, so nothing in the Match Rate v1.0 scope depends on it.
#
# nitrogen and protein: USDA's protein value is nitrogen times a per-food conversion factor, which
# the archive carries in its own file. Both are here so that a per-g-protein basis can be audited.

[units]
# The unit the archive's nutrient.csv must give for a carried nutrient; a row in any other unit is
# a flag, never silently converted.
amino_acids    = G
protein        = G
nitrogen       = G
