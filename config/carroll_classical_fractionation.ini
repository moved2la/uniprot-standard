# ============================================================
#  carroll_classical_fractionation.ini — hand-written (D50)
#
#  The measured values of Carroll, Carrithers & Trappe 2004
#  (J Muscle Res Cell Motil 25:55; doi 10.1023/B:JURE.0000021362.55389.6b;
#  source id carroll_2004 in mass_fraction_decisions.ini):
#  myosin heavy chain and actin per total fiber protein, by quantitative
#  SDS-PAGE against purified standards, in human single fibers of
#  types I and IIa.
#
#  Transcribed by the author from the article PDF on disk
#  (data/literature/carroll_2004/, sha256 in data/literature/manifest.ini).
#  One value per section, with the page and table/figure it was read from.
#  These values feed outputs/mass_fractions/classical_check_carroll_2004.tsv
#  ONLY. They are never a weight (D39).
#
#  `___` = to be filled by the author. The check stage stops on any `___`
#  it needs; it never defaults.
# ============================================================

[meta]
source_id        = carroll_2004
decision         = D50
transcribed_by   = author
transcribed      = ___

