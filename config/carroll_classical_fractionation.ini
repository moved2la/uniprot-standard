# ============================================================
#  carroll_classical_fractionation.ini — hand-written (D50)
#
#  The measured values of Carroll, Carrithers & Trappe 2004
#  (J Muscle Res Cell Motil 25:55-59; doi 10.1023/B:JURE.0000021362.55389.6b;
#  source id carroll_2004 in mass_fraction_decisions.ini):
#  myosin heavy chain (MHC) and actin per total fiber protein (TP), by
#  SDS-PAGE with silver staining against purified standards, in human
#  vastus lateralis single fibers expressing only MHC I or only MHC IIa.
#
#  Transcribed from the article PDF on disk
#  (data/literature/carroll_2004/B_JURE.0000021362.55389.6b.pdf,
#  sha256 in data/literature/manifest.ini). One value per section, with
#  the page and figure/paragraph it was read from. The paper's own
#  wording is kept in `as_reported`; the PDF text layer renders the
#  micro sign as "lg" (ligature), read here as "µg".
#  These values feed outputs/mass_fractions/classical_check_carroll_2004.tsv
#  ONLY. They are never a weight (D39).
# ============================================================

[meta]
source_id        = carroll_2004
decision         = D50
transcribed_by   = author (extracted from the PDF text by code-assisted read 2026-09-12; checked against the PDF by the author)
transcribed      = 2026-09-12
study            = 5 subjects (3 M, 2 F; 24 +/- 1 y), vastus lateralis; 480 fibers typed, 252 analysed for MHC (mean 50/subject), 160 for actin (mean 32/subject); pure MHC I and pure MHC IIa fibers only  (Abstract p.55; Results p.57)
statistics       = per-fiber values averaged per subject; subject means compared by paired t-test; all data mean +/- standard error  (Statistical analysis, p.57)
unit_definition  = µg of MHC or actin per mg of total fiber protein; TP by Micro-BCA assay  (Methods p.56; Fig. 2 legend p.57). Fraction of total fiber protein = value / 1000.

# ------------------------------------------------------------
#  Measured values
# ------------------------------------------------------------

[myosin_heavy_chain.type_I]
value        = 266
spread       = 29
spread_kind  = standard error of the mean over 5 subjects
n_fibers     = 252 (both types together; mean 50 per subject)
unit         = µg MHC per mg total protein
as_reported  = "MHC I (266 ± 29 lg MHC/mg TP)"
location     = Abstract, p.55; Fig. 2 (solid bar, MHC), p.57

[myosin_heavy_chain.type_IIa]
value        = 364
spread       = 39
spread_kind  = standard error of the mean over 5 subjects
n_fibers     = 252 (both types together; mean 50 per subject)
unit         = µg MHC per mg total protein
as_reported  = "MHC IIa (364 ± 39 lg MHC/mg TP)"; "26 ± 4% greater (P < 0.05)" than MHC I
location     = Abstract, p.55; Results, p.57; Fig. 2 (open bar, MHC), p.57

[actin.type_I]
value        = 171
spread       = 17
spread_kind  = standard error of the mean over 5 subjects
n_fibers     = 160 (both types together; mean 32 per subject)
unit         = µg actin per mg total protein
as_reported  = "MHC I: 171 ± 17 lg actin/mg TP"
location     = Abstract, p.55; Fig. 2 (solid bar, Actin), p.57

[actin.type_IIa]
value        = 165
spread       = 17
spread_kind  = standard error of the mean over 5 subjects
n_fibers     = 160 (both types together; mean 32 per subject)
unit         = µg actin per mg total protein
as_reported  = "MHC IIa: 165 ± 17 lg actin/mg TP"; "No differences (P > 0.05)" between types
location     = Abstract, p.55; Fig. 2 (open bar, Actin), p.57

# ------------------------------------------------------------
#  What the gel bands contain, and how a band is mapped onto
#  pool entries. The band is one absorbance measurement of a
#  whole band on the gel (Methods p.56); every heavy chain that
#  co-migrates is in it. The mapping rule is D52 (see decisions.md).
# ------------------------------------------------------------

[band.myosin_heavy_chain]
band_definition_location = Methods, "MHC and actin concentration", p.56: 5% separating gel; "determining absorbance of a whole band and comparing this to a known standard"; MHC standard Sigma M-7659, 50 ng in triplicate
fiber_type_definition    = fibers classified I / I/IIa / I/IIa/IIx / IIa / IIa/IIx / IIx by MHC protein migration (p.56); only pure MHC I and pure MHC IIa fibers analysed (p.57)
mapping_rule             = D52
anchor_genes             = MYH7;MYH2;MYH1   ; the three heavy chains that define types I / 2A / 2X in the primary dataset (Murgia 2021, Methods; already the fiber-type basis of this standard, D41)

[band.actin]
band_definition_location = Methods, "MHC and actin concentration", p.56: 6-12% gradient gel; whole-band absorbance against actin standard Sigma A-2522, 20 ng
mapping_rule             = D52
anchor_genes             = ACTA1   ; the normalisation anchor of the primary dataset (Murgia 2021, Dataset 1 cell E1; [columns.murgia_2021.file.1] scale_anchor)
