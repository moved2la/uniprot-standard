note            = Whole erythrocytes and their white-ghost membranes from four healthy donors, leucocyte-depleted by filtration; MED-FASP, Q Exactive HF, MaxQuant; abundances by the total protein approach (TPA). The weight column is Table S3 "Fraction of total protein Donor 1..4" under "Whole erythrocyte" (sheet "Table S3", header rows 2-3, columns P-S): a MASS SHARE in percent, summing to 100 per donor — used as-is, no molecular-weight step (the copies-per-cell columns are derived with an assumed 90 fL cell volume and 20 % protein content, p. 2755 left column, and are not read). Purity checks cited for the erythrocyte scope (p. 2755, "RBC Purity"): about one leucocyte per 10^4 erythrocytes (histone copies), below one platelet per 10^3, below 0.1 % reticulocytes; albumin present at several thousand copies as plasma carry-over. Haemoglobin subunit copies (p. 2756, "Analysis of the Whole RBCs"): alpha and beta about 200 million, delta about 30 million, gamma about 4 million, plus embryonic theta / zeta / mu at 10^5-10^6. Haemoglobin's TPA share of erythrocyte protein is about 53 % (median of the four donors; see D102). Stored names: pr7b00025_si_002.xlsx and acs.jproteome.7b00025.pdf (F7 takes the last URL segment; F7b adds .pdf). The SI URL follows the ACS suppl_file pattern and the file name ACS served — confirm it against the browser's download record.

