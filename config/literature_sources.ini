note            = Erythrocytes purified by cellulose chromatography, Percoll and FACS (no reticulocytes detected in the purified population; six donors, p. 2648 "Preparation of highly purified..."); LFQ by MaxQuant; absolute quantification anchored to each sample's measured mean corpuscular haemoglobin (p. 2648 "Absolute quantification"; the LFQ of haemoglobin = the sum over all globin chains). A DIFFERENT ANCHOR from bryk_2017 — that is why it is the cross-check. Their comparison with bryk_2017 (p. 2651, Fig. 3C): R^2 = 0.989 over the shared proteins, "the globins were quantified at higher levels in our experiments"; p. 2655 Discussion, second paragraph, states that bryk_2017's values imply under 10 pg haemoglobin per cell, "a value that strongly underestimates the hemoglobin content of red cells", most likely because the MS signals for globin peptides are underestimated. Haemoglobin's share of the MS signal in purified erythrocytes is about 0.7 (Fig. 2A, p. 2650, cumulative haemoglobin fraction at 2000+ peptides) — the second measured value for D102. The supplemental Excel file 1 (sheets "Abs Quant WC preparations", "EPP copy numbers") was NOT found linked on the article page on 2026-09-18; only supplemental Figure S1 is served. Until the Excel is obtained, this source is a cited cross-check for the haemoglobin share, not a per-protein table. Stored names: advances023515.pdf and Absolute-proteome-quantification-of-highly.pdf (for file.2, the page URL's last segment plus .pdf; rename ba023515-suppl1.pdf to that, or replace file.2.url with the exact link the page serves for the figure).

