note            = Open access, CC BY 4.0. Non-depleted plasma, iST preparation, Q Exactive HF, MaxQuant 1.5.2.10, MaxLFQ with "match between runs" against a library of depleted plasma and ten undepleted individuals (p. 193 "Data Analysis"). Weight rule: LFQ intensity is a mass-proportional summed-peptide signal; a protein's weight is its share of the summed LFQ intensity of the quantified set (the TPA reading), no molecular-weight step. Table S3 (mmc4) carries only CVs — no per-individual intensities — so the ten-individual set is not in the supplement; the per-individual MaxQuant output is in PXD002854 if wanted. Table S2: 321 quantified rows, one donor, 15 workflow replicates (technical spread only). Contaminant rule for plasma, cited: haemoglobin subunits alpha / beta / delta and carbonic anhydrase 1 rise linearly with spiked erythrocyte lysate (p. 188 right column, Fig. 3B) and keratins are handling contamination (p. 186 right column); removing both tightens the clustering of replicates (Fig. S3). Immunoglobulins appear as constant-region protein groups (IGHG1-4, IGHA1, IGHM, IGKC, IGLC...) — the basis for the variable-domain bound (D103, immunoglobulin decision pending). Albumin's LFQ share of Table S2's quantified set is about 24 % (see D102 for the top-compression observation shared with the erythrocyte compartment). Stored names: 1-s2.0-S2405471216300722-mmc3.xlsx, -mmc6.xlsx, -mmc8.pdf.

