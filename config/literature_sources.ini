# ============================================================
#  literature_sources.ini — every literature source this repository cites
#
#  One section per source, moved here unchanged from
#  mass_fraction_decisions.ini (Step 7a). That file keeps its column
#  maps and digest rules; a test asserts every source it maps columns
#  for is listed here.
#
#  used_for = what the source is used for, comma-separated. The values are
#             the columns of [categories] below; a source serving
#             several carries several names. A source that feeds no
#             calculation carries the unused_marker instead.
#             data/literature/manifest_map.tsv is generated from this
#             key: one row per source, one column per purpose.
#
#  Files are listed as file.<n>.url / file.<n>.published_name /
#  file.<n>.sha256. A source with NO file.<n>.* keys is cited but not
#  stored — a method citation, a provenance reference, or a paywalled
#  article whose values were never transcribed. Those are never flagged
#  for a missing file; there is no file to miss.
#
#  Nothing here is downloaded (D80). A file is obtained by hand once and
#  hashed once; `python run.py fetch-literature` hashes what is on disk
#  and writes the manifest. A file named here that is not on disk, or
#  whose bytes no longer hash to its pin, is a flag.
#
#  A blank sha256 is a file that has never been hashed: the next
#  fetch-literature run records what is on disk (F2). `___` is never a
#  hash — it is only ever a value a person types (F2b).
# ============================================================

[meta]
step            = 7a
written         = 2026-09-18
governing_rule  = PROVENANCE.md
decisions_from  = D31
note            = sources moved out of mass_fraction_decisions.ini unchanged; used_for added per source

# ------------------------------------------------------------
#  The columns of data/literature/manifest_map.tsv, in this order.
#  A new category is added by appending it here and putting its
#  name in the used_for of every source it is used for.
# ------------------------------------------------------------

[categories]
columns         = original, skeletal_muscle, non_protein_metabolites, other
unused_marker   = unused

