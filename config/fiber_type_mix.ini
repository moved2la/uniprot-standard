# ============================================================
#  fiber_type_mix.ini — hand-written
#
#  The share of a muscle's protein that sits in each fiber type —
#  the only number the final column of _calculated_amino_acid_standard.tsv
#  needs that the primary dataset cannot supply (its fibers were
#  selected pure, not sampled from a muscle). The standard is
#  computed per fiber type from the dataset; this file says how the
#  three are combined into one column:
#
#      standard = share_I x total_I + share_IIa x total_IIa + share_IIx x total_IIx
#
#  Transcribed BY THE AUTHOR from a cited source, with page and
#  table beside the values (D50 pattern). `basis` says what the source
#  measured (e.g. cross-sectional area fraction, fiber-count fraction);
#  the shares are used as fractions of muscle protein mass and the
#  basis is stated in the output header. Shares are normalised to
#  sum to one by code. `___` = not yet filled: the final column stays
#  blank and a test says so.
# ============================================================

