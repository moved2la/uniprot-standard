# ============================================================
#  stress_test_settings.ini — hand-written (D65)
#
#  How hard pipeline/stress.py pushes the weights. Author-set numbers;
#  comma-separated lists (a ';' after whitespace starts a comment).
#    composition_distance_top_entries  the k largest entries compared with each other and the standard
#    convergence_top_k                 the profile from the top-k entries only
#    knockout_top_k                    the top-k entries removed
#    contractile_share                 the contractile share of the total forced to each value (measured ~0.72)
#    size_tilt_alpha                   every weight x MW^alpha
#    random_abuse_factor               one-sigma multiplicative error per entry (3 = x/÷ 3)
#    random_abuse_draws, seed          draws per factor and the seed
#  Nothing biological is named.
# ============================================================

[stress]
composition_distance_top_entries = 10
convergence_top_k                = 10, 50, 100, 500, 1000
knockout_top_k                   = 1, 5, 10
contractile_share                = 0.60, 0.65, 0.72, 0.78, 0.85
size_tilt_alpha                  = -1.0, -0.5, -0.25, 0.25, 0.5
random_abuse_factor              = 2, 3, 10
random_abuse_draws               = 2000
seed                             = 20260913
decision                         = D65
