# ============================================================
#  fao_2013_indispensable_amino_acids.ini — hand-written (D62)
#
#  Which amino acids are dietary indispensable, and how the reference
#  scoring pattern groups them — transcribed BY THE AUTHOR from
#  FAO 2013, Food and Nutrition Paper 92 (source id fao_2013 in
#  mass_fraction_decisions.ini; the PDF is pinned by fetch_literature.py
#  under data/literature/fao_2013/, sha256 in data/literature/manifest.ini).
#  Same shape as carroll_classical_fractionation.ini (D50): one value per
#  key, with the table, page, and the report's own wording next to it.
#
#  Symbols are written as the report prints them (three-letter
#  abbreviations). The aggregation stage resolves them to one-letter
#  symbols through data/iupac/amino_acid_symbols.ini — parsed by code from
#  the IUPAC-IUBMB table (rule C0) — so no amino acid name is typed twice.
#  Lists are comma-separated (a ';' after whitespace starts a comment).
#
#  Used by: outputs/standard/eaa_subset.tsv — the standard expressed for
#  these nine headings in mg per g protein, the unit of the report's
#  scoring patterns, so that Match Rate and DIAAS can be compared on the
#  report's own terms. The report's requirement numbers are NOT used here.
#  This file carries no abundance, no weight, and no protein.
# ============================================================

[meta]
source_id      = fao_2013
decision       = D62
transcribed_by = Anthony Boldin
transcribed    = 2026-09-13
file           = data/literature/fao_2013/35978-02317b979a686a57aa4593304ffc17f06.pdf

[indispensable_amino_acids]
headings     = His, Ile, Leu, Lys, SAA, AAA, Thr, Trp, Val
location     = Table 5, p. 29
as_reported  = His Ile Leu Lys SAA AAA Thr Trp Val

[group.SAA]
members      = Met, Cys
location     = Table 4, p. 28, row "Met + Cys" and Table 5 footnote 1 (infant row = Table 4) and acronyms p. ix
as_reported  = Met + Cys

[group.AAA]
members      = Phe, Tyr
location     = Table 4, p. 28, row "Phe + Tyr" and Table 5 footnote 1 and acronyms p. ix
as_reported  = Phe + Tyr
