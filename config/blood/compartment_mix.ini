# ============================================================================
#  config/blood/compartment_mix.ini  --  HAND-WRITTEN (drafted by Claude,
#  delivery 9, from the locations already recorded in literature_sources.ini;
#  every number to be verified by the author against the PDFs on disk)
#
#  The blood analogue of fiber_type_mix.ini: how the two compartments' protein
#  masses are computed (D100, D119) so their profiles can be mixed. The
#  haemoglobin share of erythrocyte protein is NOT a number here: the base
#  standard uses the share the weights measure, and the sensitivity (D102,
#  D117) recomputes at each published share listed under [dominant.*].
#
#  Erythrocyte protein = haemoglobin mass / haemoglobin share, with
#  haemoglobin mass = red-cell volume x MCHC (D119; the blood route, blood Hb
#  x blood volume, is reported as a cross-check). Plasma protein = plasma
#  volume x plasma protein concentration.
# ============================================================================

[reference]
sex                 = male              ; ICRP reference male (D119); the female values are recorded below and reported as a line, not the base
decision            = D100, D102, D117, D119

[compartment.plasma]
volume_ml           = 3000
volume_location     = icrp_2002 file.1, p. 138 section 7.3: plasma 3000 ml (M), 2400 ml (F)
volume_ml_female    = 2400
protein_g_per_l     = 71.5
protein_location    = rustad_2004 file.1, Table I p. 274, plasma row: 64-79 g/L, both sexes pooled; the midpoint stands for the reference person (D100)
protein_range_g_per_l = 64, 79

[compartment.erythrocytes]
volume_ml           = 2300
volume_location     = icrp_2002 file.1, p. 138 section 7.3: red cell volume 2300 ml (M), 1500 ml (F)
volume_ml_female    = 1500
mchc_g_per_l        = 337
mchc_location       = nordin_2004 file.1, Table III p. 389 "All data" mean 337 g/L; Table V p. 394 midpoint of 317-357 also 337; icrp_2002 p. 137 section 7.2.2 gives 33.5 g/100 ml red cells, within 1 %
blood_hb_g_per_l    = 152
blood_hb_location   = nordin_2004 file.1, Table V p. 394, B-Hb males 134-170 g/L, midpoint; the blood route of the haemoglobin mass, reported as a cross-check (D119)
blood_hb_g_per_l_female = 135
blood_hb_female_location = nordin_2004 file.1, Table V p. 394, B-Hb females 117-153 g/L, midpoint
haematocrit         = 0.448
haematocrit_location = nordin_2004 file.1, Table V p. 394, B-EVF males 0.395-0.500, midpoint; icrp_2002 p. 138: red cells 43 % (42-52 %) of blood volume

# ----------------------------------------------------------------------------
#  The dominant protein of each compartment and its published shares (D102,
#  D117). The `as measured` share is computed by the stage from the weights
#  and is the base; the shares below are the sensitivity. Genes identify the
#  entries through their HGNC symbol in accessions.ini.
# ----------------------------------------------------------------------------

[dominant.erythrocytes]
genes               = HBA1, HBA2, HBB, HBD, HBE1, HBG1, HBG2, HBM, HBQ1, HBZ
genes_location      = HGNC gene group "Hemoglobin subunits" (genenames.org)
share.gautier_2018  = 0.70
share.gautier_2018.location = gautier_2018 file.1, Fig. 2A p. 2650: cumulative haemoglobin fraction of the MS signal in purified erythrocytes, about 0.7; p. 2655 second paragraph of the Discussion on bryk_2017's under-estimate of the globin signal
share.icrp_2002_implied = computed
share.icrp_2002_implied.location = computed by the stage from cited numbers: haemoglobin mass (red-cell volume x MCHC) over ICRP's whole-blood protein (18 % of 5600 g, p. 137 section 7.2.1) minus plasma protein; the "about 95 % by classical chemistry" of the step report had no citation and is not used as a number

[dominant.plasma]
genes               = ALB
genes_location      = HGNC symbol ALB (serum albumin)
share.hortin_2008   = 0.508
share.hortin_2008.location = hortin_2008 file.3 (Supplementary Table 2, sheet DataBase): albumin 43500 mg/L of the summed table 85668 mg/L (a computed share of that table); p. 1608 right column states albumin is more than half of plasma protein mass

# ----------------------------------------------------------------------------
#  Cross-checks, reported not used (D100, D116)
# ----------------------------------------------------------------------------

[cross_check.whole_blood_protein]
blood_mass_g        = 5600
protein_fraction    = 0.18
location            = icrp_2002 file.1, p. 18 Table 2.8 row "Blood" 5600 g (M) / 4100 g (F); p. 137 section 7.2.1 whole blood protein 18 %
blood_mass_g_female = 4100

[cross_check.hortin_summed_table]
plasma_protein_g_per_l = 85.7
location            = hortin_2008 file.3, the sum of the 153 mean concentrations of Supplementary Table 2; above every clinical interval (rustad_2004 Table I), which is why the plasma protein concentration is rustad_2004's
