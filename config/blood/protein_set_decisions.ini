# ============================================================================
#  config/blood/protein_set_decisions.ini  --  HAND-WRITTEN (see docs/conventions.md)
#
#  The protein-set decisions of the blood category (Step 7b). Blood has no Gene
#  Ontology seed and no tier split: each pool is the quantified set of its primary
#  dataset (D98), read by published accession (D107, rules P1-P6). This file names
#  the pools, the dataset each is read from, and the contaminant rule of each
#  compartment as the sources state it. The only protein names in this file are
#  the ones D98 names, each with the page it comes from; the code matches them
#  against the dataset's own gene cell and never looks a gene up.
#
#  Flag closures ([flag.<accession>]) follow the muscle file's pattern.
# ============================================================================

[scope]
category        = blood

# ----------------------------------------------------------------------------
#  The two compartments (D95). In the code they are the pools of one category:
#  weighted within themselves by the mass-fraction stage, mixed by the split
#  (D100) at the aggregate step. The `tier` field of the generated
#  config/blood/accessions.ini holds these names (adaptation list: the field
#  is called tier; it means pool membership).
# ----------------------------------------------------------------------------

[pool.plasma]
compartment_decision        = D95
dataset_source              = geyer_2016           ; [source.*] in config/literature_sources.ini, role = primary, used_for = blood
dataset_file                = file.1               ; Table S2; its column map is [columns.geyer_2016.file.1] in config/blood/mass_fraction_decisions.ini
pool_decision               = D107
contaminant_decision        = D98
named_contaminant_genes     = HBA1, HBB, HBD, CA1
named_contaminant_location  = geyer_2016 file.3 (Document S2), p. 188 right column and Fig. 3B: haemoglobin subunits alpha, beta and delta and carbonic anhydrase 1 rise linearly with spiked erythrocyte lysate; p. 186 right column: keratins are handling contamination

[pool.erythrocytes]
compartment_decision        = D95
dataset_source              = bryk_2017            ; [source.*] in config/literature_sources.ini, role = primary, used_for = blood
dataset_file                = file.1               ; Table S3; its column map is [columns.bryk_2017.file.1] in config/blood/mass_fraction_decisions.ini
pool_decision               = D107
contaminant_decision        = D98
named_contaminant_genes     = ALB
named_contaminant_location  = bryk_2017 file.2 (article PDF), p. 2755, "RBC Purity": albumin present at several thousand copies per cell as plasma carry-over

# ----------------------------------------------------------------------------
#  How "keratins" (D98) become a rule the code can apply the same way to both
#  datasets: an entry carrying UniProt's controlled-vocabulary keyword
#  "Keratin" is a keratin. The keyword ids of every looked-up entry are read
#  from UniProt at enumeration; nothing is matched on a gene name. The
#  MaxQuant contaminant marker (CON__) was found to differ between the two
#  datasets' searches (KRT2 flagged in geyer_2016, not in bryk_2017), so it
#  is not the rule; a group whose FIRST token is a marker is still a
#  contaminant group (P4), and a marker elsewhere in a group is recorded.
# ----------------------------------------------------------------------------

[contaminant_rules]
keratin_keyword_id      = KW-0416
keratin_keyword_name    = Keratin
keratin_keyword_url     = https://www.uniprot.org/keywords/KW-0416
keratin_rule_decision   = D109

# ----------------------------------------------------------------------------
#  Flag closures. One section per flag subject from outputs/blood/flags.tsv.
#  Add sections here only in response to a raised flag; each carries a D-number.
#
#  [flag.<accession>]
#  rule         = chain_position_uncertain
#  decision     = D<n>
#  master_start = <int>
#  master_end   = <int>
# ----------------------------------------------------------------------------
