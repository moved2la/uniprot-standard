# ------------------------------------------------------------
#  config/blood/mass_fraction_decisions.ini -- HAND-WRITTEN
#
#  The blood category's copy of mass_fraction_decisions.ini (Step 7b).
#  [scope] names the category whose sources the stages read (D106).
#  The column maps below are written BY LETTER, from the excerpts of
#  the files on disk (run.py excerpt, 2026-09-19): two of the blood
#  tables carry duplicate or stray column names, so a header string
#  cannot identify a column. `header_row` is the last header row;
#  data starts on the row after it.
#
#  Delivery 6 wrote the two primary maps; delivery 8 added Geyer
#  Table S5, Hortin, [cross_checks] and [immunoglobulin_bound].
# ------------------------------------------------------------

[scope]
category        = blood

# ------------------------------------------------------------
#  Erythrocytes: bryk_2017 Table S3 (sheet "Table S3"), header rows
#  2-3, 2,653 data rows below row 3. Excerpt:
#  data/literature/bryk_2017/pr7b00025_si_002__first20.tsv
# ------------------------------------------------------------

[columns.bryk_2017.file.1]
sheet                   = Table S3
header_row              = 3
header_rows_note        = row 1 is the title; rows 2-3 are the header (row 2 the group label "Whole erythrocyte" / "White ghosts", row 3 the column name)
identity_column         = A                       ; "Protein IDs": semicolon-joined accessions in the published order; the pool entry is the first reviewed human one (P4)
identity_kind           = accession_list
gene_column             = C                       ; "Gene names"
share_columns           = P, Q, R, S              ; "Whole erythrocyte | Fraction of total protein Donor 1..4": a MASS SHARE in percent, each donor summing to 100
share_kind              = mass_share              ; D105: used as-is, no molecular-weight step
share_scale             = percent
share_statistic         = mean                    ; D108: the weight is the mean of the four donors; per-donor profiles are a sensitivity
share_count             = 4                       ; four donors (n = 4, between-donor spread)
missing_value_token     =                         ; a protein not quantified in a donor reads 0 in that donor's column (as published)
location                = bryk_2017 file.1, sheet "Table S3", row 3 headers
quantity_definition     = fraction of total protein per donor, total protein approach (TPA), whole erythrocytes; the copies-per-cell columns beside it rest on an assumed cell volume and are not read (D101, p. 2755 left column)
quantity_source         = bryk_2017 file.2 (article PDF), Methods -- the paragraph defining the TPA fraction: page and paragraph to be filled by the author from the PDF on disk (___)

# ------------------------------------------------------------
#  Plasma: geyer_2016 Table S2 (sheet "Supplementary Table S2"),
#  header row 1, 323 rows of which 321 carry a quantification (the
#  other two are a blank row and a footnote). Excerpt:
#  data/literature/geyer_2016/1-s2.0-S2405471216300722-mmc3__table_s2.tsv
# ------------------------------------------------------------

[columns.geyer_2016.file.1]
sheet                   = Supplementary Table S2
header_row              = 1
identity_column         = C                       ; "Majority Protein IDs": semicolon-joined accessions in the published order (P4)
identity_kind           = accession_list
gene_column             = B                       ; "Gene Names"
abundance_column        = D                       ; "Average LFQ Intensity [log10]": log10 of the mean over the fifteen workflow replicates
abundance_scale         = log10
share_kind              = mass_share              ; D105: 10^x, share of the summed quantified set; no molecular-weight step
replicate_columns       = N, O, P, Q, R, S, T, U, V, W, X, Y, Z, AA, AB   ; "Run #1".."Run #15", log10 LFQ per replicate: technical spread, n = 15
cv_column               = H                       ; "Coefficient of variation [%]"
stray_columns_note      = columns AC-AK are cells to the right of the table, including a second column named "Protein Names"; never read
location                = geyer_2016 file.1, sheet "Supplementary Table S2", row 1 headers
quantity_definition     = MaxLFQ intensity of one venous plasma sample, fifteen workflow replicates, averaged; a mass-proportional summed-peptide signal
quantity_source         = geyer_2016 file.3 (Document S2), p. 193 "Data Analysis"

# ------------------------------------------------------------
#  Plasma, deep dataset: geyer_2016 Table S5 (sheet name truncated
#  by Excel to "Supplementary Table SDeepDatase"), header row 1,
#  1,040 rows of which 965 carry an LFQ value. Read only by the
#  completeness cross-check: the share of S5's summed signal on
#  proteins absent from Table S2. Reported, not used.
# ------------------------------------------------------------

[columns.geyer_2016.file.2]
sheet                   = Supplementary Table SDeepDatase
header_row              = 1
identity_column         = C                       ; "Majority Protein IDs"
identity_kind           = accession_list
gene_column             = B                       ; "Gene Names"
abundance_column        = D                       ; "LFQ Intensity [log10]"
abundance_scale         = log10
location                = geyer_2016 file.2, sheet row 1 headers; column K (Plasma Proteome Database concentration, 637 rows) is not read

# ------------------------------------------------------------
#  Plasma cross-check: hortin_2008 Supplementary Table 2, sheet
#  "DataBase", header row 1, 153 rows. Joined to the plasma pool
#  by canonical UniProt accession (column C, cleaned of isoform
#  suffixes and stray tokens); rows without a UniProt accession
#  (six immunoglobulin chains, an EMBL id, two RefSeq ids) are
#  listed, not joined. The Carroll pattern (D101): a ratio per
#  protein and the plasma profile under Hortin's weights beside
#  the pool's. Reported, not used.
# ------------------------------------------------------------

[columns.hortin_2008.file.3]
sheet                   = DataBase
header_row              = 1
name_column             = B                       ; "Polypeptide"
identity_column         = C                       ; "Data Entry" -- the UniProt accession where the row has one
gene_column             = D                       ; "Gene"
value_column            = G                       ; "Conc., mg/L Mean" -- a mass concentration; a mass share of the joined set after summing
value_unit              = mg/L
location                = hortin_2008 file.3, sheet "DataBase", row 1 headers; the table's own sum is 85.7 g/L against 71.5 g/L plasma protein (D100), which is why it is a cross-check and not a weight

[cross_checks]
hortin_source           = hortin_2008
hortin_file             = file.3
hortin_pool             = plasma
deep_source             = geyer_2016
deep_file               = file.2
deep_pool               = plasma

# ------------------------------------------------------------
#  D113: the immunoglobulin variable-domain bound. A constant-
#  region entry (IGHG1, IGKC, ...) is quantified by its constant
#  domains; the molecules it stands for also carry variable
#  domains no row measures. Bound per entry = w x L_V / L_C, with
#  L_C the entry's master length and L_V the mean master length
#  of the pool's own V-region entries of the same chain. Chains
#  and segments are read from the HGNC gene symbol: locus prefix
#  IGH / IGK / IGL, then a segment letter V, D or J followed by a
#  digit for a variable-region segment gene (IGHV3-23, IGKV4-1,
#  IGHJ4); any other symbol with the prefix is a constant-region
#  gene (IGHG1, IGHA1, IGHM, IGHD, IGKC, IGLC2). A chain with no
#  V-region entry in the pool falls back to the loose bound (the
#  whole share) and says so in the table.
# ------------------------------------------------------------

[immunoglobulin_bound]
decision                    = D113
chain_prefixes              = IGH, IGK, IGL
variable_segment_letters    = V, D, J
nomenclature_source         = HGNC immunoglobulin gene nomenclature (genenames.org; gene groups "Immunoglobulin heavy locus", "Immunoglobulin kappa locus", "Immunoglobulin lambda locus"), following IMGT (Lefranc 2001): locus prefix + segment letter V/D/J/C
