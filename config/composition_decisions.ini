# ============================================================================
#  composition_decisions.ini -- HAND-WRITTEN (docs/conventions.md).
#
#  The only author-written inputs to the composition stages: two source URLs
#  and one rule. No amino acid name, symbol, or mass is typed anywhere; the code
#  parses the symbol table from its source and fetches every mass.
# ============================================================================

[amino_acid_symbols]
# The table that defines the one-letter code: IUPAC-IUB Joint Commission on
# Biochemical Nomenclature, "Nomenclature and Symbolism for Amino Acids and
# Peptides. Recommendations 1983", Pure Appl. Chem. 1984, 56(5), 595-624, Table 1
# (https://publications.iupac.org/pac/1984/pdf/5605x0595.pdf). The URL below is the
# IUBMB web copy of Table 1 in its "table-free" (plain text) form, which the code
# parses for <trivial name> <three-letter symbol> <one-letter symbol> rows.
url      = https://iupac.qmul.ac.uk/AminoAcid/tab1.html
decision = D26

[mass_source]
# PubChem PUG REST, queried by compound name; the served MolecularWeight is used
# unchanged. The response is saved as received.
base_url   = https://pubchem.ncbi.nlm.nih.gov/rest/pug
properties = MolecularFormula,MolecularWeight,IUPACName
decision   = D26

[query_name_rule]
# Table 1 footnote a: the trivial name refers to the L, D, or DL amino acid, and
# for those that are chiral only the L amino acid is used in protein biosynthesis;
# section 3AA-14.5: the symbols denote the L configuration unless otherwise
# indicated. The code therefore queries PubChem with the prefix below joined to
# the trivial name parsed from Table 1. If PubChem has no compound under that
# name, the bare trivial name is queried instead, and the table records which
# name resolved for every row.
chiral_prefix = L-
decision      = D26

[extra_compounds]
# Non-amino-acid masses the composition engine needs, fetched the same way:
# water for the residue / free-amino-acid conversion (one H2O per peptide bond),
# hydrogen (H2) for the disulfide-bond mass delta (two H per bond).
water    = water
hydrogen = hydrogen
decision = D26
