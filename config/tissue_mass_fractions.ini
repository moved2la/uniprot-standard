# ============================================================================
#  config/tissue_mass_fractions.ini  --  HAND-WRITTEN (drafted by Claude,
#  delivery 10, from the ICRP pages and the config sections already in the
#  repository; every number to be verified by the author against the PDF on
#  disk). Layer C (D67, D121): how much protein each category holds in the
#  reference person, so the category standards can be mixed into one
#  composite (pipeline/composite.py, rules L1-L4 in docs/conventions.md).
#
#  One [category.<name>] section per category standard. The composite is
#  weighted by PROTEIN MASS (L1): a category's profile is a percent of its
#  amino acid mass, and the mass that percent applies to is the category's
#  protein in the reference body. Two ways a category states that mass:
#    tissue_mass_x_protein_content   cited tissue mass x cited protein per kg
#    category_split                  the category's own stage computed it
#                                    (blood: D100 / D119, compartment_split.tsv)
#  The reference is the ICRP adult male (D100); the female masses are
#  recorded beside and reported as a line, never the base (D119 pattern).
#
#  Adding a category = adding a section here, once its standard exists.
# ============================================================================

[meta]
decisions      = D121, D122, D123, D124
reference_sex  = male
transcribed_by = Claude (draft); author verifies every number against the PDF
transcribed    = 2026-09-19
note           = Table 2.8 spans pp. 18-19 of ICRP Publication 89; both rows used are on p. 18. The Adult columns are M and F; the 15-year columns beside them are not used.

# ----------------------------------------------------------------------------
#  Skeletal muscle: the muscle standard WITH its non-protein metabolite pools
#  (D82: the Match Rate primary reference). Protein mass = ICRP's skeletal
#  muscle mass x Mingrone 2001's protein per kg wet muscle (D77), read from
#  config/non_protein_metabolite_pools.ini so the value is transcribed once.
# ----------------------------------------------------------------------------

[category.skeletal_muscle]
label                    = skeletal muscle protein + non-protein metabolite pools (carnosine), fiber-type mix
standard_file            = outputs/standard/_calculated_amino_acid_standard_with_non_protein_metabolite_pools.tsv
standard_column          = standard_with_non_protein_metabolite_pools
residue_file             = outputs/standard/_calculated_amino_acid_standard_residue_convention.tsv
residue_column           = standard
protein_mass             = tissue_mass_x_protein_content
tissue_mass_g            = 29000
tissue_mass_g_female     = 17500
tissue_mass_location     = icrp_2002 file.1, p. 18, Table 2.8, row "Muscle, skeletal", columns Adult M (29 000) and Adult F (17 500)
protein_content_from     = config/non_protein_metabolite_pools.ini [protein_content]
protein_content_basis    = wet
protein_content_note     = 155 g per kg wet muscle, SD 37 over 16 subjects, rectus abdominis (mingrone_2001, p. E368, Table 1, row "Proteins, %", column "Control Group (n = 16)"; D77). ICRP's tissue mass is a wet mass, so the wet value is the one that applies. The muscle is not vastus lateralis; stated in every header.
non_protein_metabolite_pool_amounts = outputs/standard/non_protein_metabolite_pool_amounts_per_kg_muscle.tsv
fiber_type_mix           = config/fiber_type_mix.ini
note                     = the two lines above feed the amino-acid-mass line only (L4): the pool's amino acid per kg, mixed by the fiber-type shares, is what the with-pools profile is a percent of beyond the protein itself.

# ----------------------------------------------------------------------------
#  Blood: the blood standard at its base split. Protein mass = the split's
#  whole-blood protein at the base row (as measured), so the profile and the
#  mass are taken at the SAME haemoglobin share (D122). ICRP's blood mass is
#  recorded for the reported share of body mass; ICRP's whole-blood protein
#  (18 %, p. 137) is the icrp_2002_implied row of the same split table and is
#  one of the rows the sensitivity (L3) reports the composite at.
# ----------------------------------------------------------------------------

[category.blood]
label                    = blood: plasma + erythrocytes, reference male split (D100, D119)
standard_file            = outputs/blood/standard/_calculated_amino_acid_standard.tsv
standard_column          = standard
residue_file             = outputs/blood/standard/_calculated_amino_acid_standard_residue_convention.tsv
residue_column           = standard
protein_mass             = category_split
split_file               = outputs/blood/standard/compartment_split.tsv
split_column             = whole_blood_protein_g
split_base_row           = as_measured
split_female_prefix      = female
tissue_mass_g            = 5600
tissue_mass_g_female     = 4100
tissue_mass_location     = icrp_2002 file.1, p. 18, Table 2.8, row "Blood", columns Adult M (5600) and Adult F (4100)
sensitivity_file         = outputs/blood/standard/sensitivity_dominant_protein.tsv
sensitivity_row_column   = hb_share_label
sensitivity_row_share_column = hb_share
sensitivity_variant_column = albumin_share_label
sensitivity_variant_share_column = albumin_share
sensitivity_profile_column = standard
sensitivity_note         = D117: the blood profile at every published haemoglobin share x albumin share; the composite is recomputed at each with the split's whole-blood protein at that haemoglobin share (L3)
